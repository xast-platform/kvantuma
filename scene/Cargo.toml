[package]
name = "xastge-scene"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.0", default-features = false, features = ["derive", "error-context", "help", "std"] }
embree = "0.3.8"
oidn = "2.3.3"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
xastge = { path = "../engine", default-features = false, features = ["scene"] }
